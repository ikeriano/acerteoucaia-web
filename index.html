<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover,interactive-widget=resizes-content">
<meta name="theme-color" content="#02040c">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<meta name="app-version" content="1.4">
<title>¡Acerte ou Caia! 3D</title>
  
  <link rel="stylesheet" href="assets/app.css">
<script src="js/ep3000.js"></script>
<script>window.P3D_SIN = ['Male_Adult_06', 'Male_Adult_13', 'Business_Male_06', 'Female_Adult_03', 'Female_Adult_11', 'Business_Female_04'];</script>
<script src="mc3d/mc3d.js?v=1.4"></script>
</head>
<body>
<div id="app">
  <canvas id="c3d"></canvas>
  <div id="touch"></div>
  <div id="stage2d"><div id="stageBox"></div></div>
  <div id="panel"><div id="panelBox"></div></div>
  <div id="hud">
    <div id="joy"><div id="joyKnob"></div></div>
    <div id="vidas" class="ui"></div>
    <div id="hashtag"></div>
    <div id="bubble" class="hidden"><b>El Presentador</b><span></span></div>
    <div id="lower3" class="hidden"></div>
    <div id="credits" class="hidden"><div id="creditsRoll"></div></div>
    <div id="toast" class="hidden"></div>
    <div id="topbar" class="ui">
      <button id="btnMenu" title="Menú">☰</button>
      <button id="btnCam" title="Cámara">👁</button>
      <button id="btnLuces" title="Luces">💡</button>
      <button id="btnSkip" class="hidden">Saltar ⏭</button>
    </div>
    <div id="hint" class="hidden"></div>
    <div id="actions" class="ui"></div>
  </div>
  <div id="menu"></div>
  <div id="classicWrap" class="hidden"><iframe id="classic" allow="autoplay"></iframe><button id="classicBack" class="ui">⟵ Menú</button></div>
  <div id="loading"><div class="spin"></div><p>Cargando el plató…</p></div>
  <div id="rotate">Gira el móvil 📱↻</div>
  <input id="kb" type="text" autocomplete="off" autocorrect="off" autocapitalize="characters" spellcheck="false" enterkeyhint="done" aria-label="Escribe las letras">
</div>
<script>
// Idioma: Español (por defecto) o Português (Brasil) · Opciones › Idioma
window.__LANG = (function () { try { return localStorage.getItem('ac_lang') === 'pt' ? 'pt' : 'es'; } catch (e) { return 'es'; } })();
document.documentElement.lang = window.__LANG === 'pt' ? 'pt-BR' : 'es';
if (window.__LANG === 'pt') { var q = function (s) { return document.querySelector(s); };
  q('#loading p').textContent = 'Carregando o estúdio…'; q('#rotate').textContent = 'Gire o celular 📱↻'; q('#btnMenu').title = 'Menu'; q('#btnCam').title = 'Câmera';
  q('#btnLuces').title = 'Luzes'; q('#btnSkip').textContent = 'Pular ⏭'; q('#classicBack').textContent = '⟵ Menu'; q('#bubble b').textContent = 'O Apresentador'; q('#kb').setAttribute('aria-label', 'Digite as letras'); }
document.write('<script src="js/' + (window.__LANG === 'pt' ? 'app_pt' : 'app') + '.js"><\/script>');
</script>
</body>
</html>
